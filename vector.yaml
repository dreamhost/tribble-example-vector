# One pipeline:
#
#   POST /sensors/<app>  ->  shape  ->  Postgres table `events`
#
# The first commit of this repository had Kafka between the two halves; `git log` has it.

sources:
  ingest:
    type: http_server
    address: 0.0.0.0:8080
    # Everything under /sensors; the rest of the path is the producer's name.
    path: /sensors
    strict_path: false
    path_key: path
    method: POST
    decoding:
      codec: json
    # This endpoint has a public address, and whatever can post an event can start a process.
    auth:
      strategy: basic
      username: "${INGEST_USERNAME}"
      password: "${INGEST_PASSWORD}"

transforms:
  # {"payload": {"event_name": ..., "user_id": ..., ...}}  ->  one row of the `events` table.
  shape:
    type: remap
    inputs: [ingest]
    drop_on_abort: true
    drop_on_error: true
    source: |
      app = replace(string(.path) ?? "", r'^/sensors/?', "")
      body = object(.payload) ?? {}
      name = string(body.event_name) ?? ""
      user_id = string(body.user_id) ?? ""
      if app == "" || contains(app, "/") || name == "" || user_id == "" {
        log("dropped an event: it needs /sensors/<app>, payload.event_name and payload.user_id", level: "error")
        abort
      }

      # Event time is the producer's to state, in seconds; now, if it did not.
      seconds = to_unix_timestamp(now())
      if body.timestamp != null {
        seconds = to_int(body.timestamp) ?? seconds
      }
      id = string(body.id) ?? uuid_v4()

      message = body
      del(message.event_name)
      message.id = id
      message.name = name
      message.timestamp = seconds

      . = {
        "id": id,
        "name": name,
        "app": app,
        "user_id": user_id,
        "event_class": "raw",
        "occurred_at": from_unix_timestamp!(seconds),
        "ingested_at": now(),
        "message": message
      }

sinks:
  to_postgres:
    type: postgres
    inputs: [shape]
    endpoint: "${DATABASE_URL}"
    table: events
    # The HTTP source answers 200 only once Postgres has the row, so a producer that got a
    # 200 lost nothing, and one that got an error knows to send again.
    acknowledgements:
      enabled: true
